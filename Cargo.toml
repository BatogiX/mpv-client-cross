[workspace]
members = ["mpv-client-sys", "mpv-client", "mpv-client-macros"]
resolver = "3"

[workspace.package]
readme = "README.md"
authors = ["Kevin Gavrois <kevin@gavrois.fr>", "BatogiX"]
edition = "2024"
repository = "https://github.com/BatogiX/mpv-client-cross"
license = "GPL-3.0"
version = "3.0.1"

[workspace.dependencies]
mpv-client-sys = { package = "mpv-client-cross-sys", version = "3", path = "mpv-client-sys" }
mpv-client-macros = { package = "mpv-client-cross-macros", version = "3", path = "mpv-client-macros" }
serde = "1"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
log = { version = "0.4", features = ["std"] }
thiserror = "2"

# bindgen feature
bindgen = "0.72"
prettyplease = "0.2"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "warn"
panic = "warn"
multiple_crate_versions = "allow"
mod_module_files = "warn"
module_name_repetitions = "warn"
partial_pub_fields = "warn"
print_stdout = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_test_prefix = "warn"
str_to_string = "warn"
suspicious_xor_used_as_pow = "warn"
